schema_version: "1.1"
name: adv-b-contradicting-conventions
expected_outcome: |
  AGENTS.md の2規則が矛盾している。「実装の前に必ずテストを書く」と「tests/ 配下のファイルは追加も変更もしない」は両立しない。エージェントが前者を無視するのは、後者に従った結果である。
  ains-context-care の確認順（読み込まれたか → どこにあったか → 目立っていたか → 矛盾していないか → 失われていないか）に沿って、原因が「規則どうしの矛盾」だと特定し、直す場所は「一方を消し、残す方に理由を書く」と決める。どちらを残すかは人に示して承認を得る。
  規則の追加・削除は人が承認するので、承認なしに AGENTS.md を書き換えない。shop/ tests/ も変更せず、コミットしない。第三の規則を足して言い回しで解決しようとしない。
  根拠: skills/ains-context-care/SKILL.md:15（矛盾していないか）、:22（矛盾 → 一方を消し、残す方に理由を書く）、:39（規則の追加・削除は人が承認する）、:43（原因と直す場所を1つに決め、決められなければ確かめたことを人に示す）。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
