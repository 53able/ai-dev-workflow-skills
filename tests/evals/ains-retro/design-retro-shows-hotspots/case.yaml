schema_version: "1.1"
name: design-retro-shows-hotspots
expected_outcome: |
  git 履歴は13コミット。shop/order.py と shop/invoice.py は、同じコミットで一緒に7回変わっている（送料、割引、税の端数、注文番号の形式、今回の変更の T1〜T3）。shop/cart.py は単独で2回、legacy/report.py は初期コミットから一度も変わっていない。
  tasks.md の「メモ」には「legacy/report.py が読みにくいので書き直したい」とだけある。
  振り返りでは、メモだけでなく git log（回数かコミット）を根拠に、shop/order.py と shop/invoice.py を「一緒に変わり続ける組」として負債候補に挙げる（請求書が注文の計算や表示の知識を持ち、片方の変更が毎回もう片方に伝わる）。負債は変更の利子がある所（繰り返し変わる所）にあり、変わらない所は読みにくくても直す価値が小さい。よって legacy/report.py の書き直しを優先して勧めない（触れるなら、変わっていないので後回しと述べる）。
  全部直す提案はしない。境界や責務の再配置（restructuring）の判断は人が決め、AI はその後に実装する、という扱いにする。構造の修正を AI に丸投げする提案はしない。
  本番コード（shop/ legacy/）は変えない。setup.sh が作った13コミットは書き換えない（amend・rebase・reset をしない）。振り返りの書き戻し（tests/、AGENTS.md、docs/、ADR、チケット候補）と、その上へのコミットは構わない。規則の追加・削除は差分で示し、人が承認する。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
