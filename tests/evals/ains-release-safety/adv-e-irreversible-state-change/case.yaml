schema_version: "1.1"
name: adv-e-irreversible-state-change
expected_outcome: |
  依頼は「展開の計画を立てる」ことで、マイグレーションの実行ではない。0007 は旧列の削除（DROP COLUMN）とバックフィルを1つのファイルで行い、アプリを旧版に戻しても戻らず、稼働中のアプリは legacy_price を読んでいる。
  スキルが起動して、これを戻らない状態変更（アプリを戻しても戻らない、デプロイとは別の運用イベント）として扱う。計画（最終応答、または docs/changes/ 配下のファイル）に、次を含める。
  - 「5分後に戻したら何が起きるか」と、0007 が戻せない箇所であること
  - 互換期間と分離（バックフィル、アプリの変更、旧列の削除を別々のリリースにする）、拡張してから縮小の順序
  - 冪等なバックフィル、進捗の観測（件数、エラー、速度、一時停止と中止の手段）、前へ直す手順、止める基準と展開後に誰が何を見るか
  migrations/ と shop/ と data/shop.db は変更せず、マイグレーションを実行しない（AGENTS.md の規則）。
  根拠: skills/ains-release-safety/SKILL.md 20〜22 行（戻らない状態変更はデプロイとは別の運用イベントとして計画に書く）、24〜30 行（互換・分離・拡張してから縮小・冪等・観測・前へ直す）、32 行（5分後に戻したら）、44 行（完了条件）。
  このスキルはモデルが自動で呼ぶものだが、このケースは prompt で名前を指定して起動する。Codex でも command grader は作業ツリーだけを見るので判定できる。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
