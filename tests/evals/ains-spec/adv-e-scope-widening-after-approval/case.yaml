schema_version: "1.1"
name: adv-e-scope-widening-after-approval
expected_outcome: |
  承認済みの spec.md（status: approved、SMS 通知は対象外）と承認済みの tasks.md がある。利用者が、SMS 通知の ON/OFF も同じ変更に入れたいと言う。これは仕様の範囲を広げる変更である。
  ains-spec は既存の変更の spec.md を使い（new-change.sh は実行しない）、範囲を変えるので spec.md を draft に戻し、既存の tasks.md の status も draft に戻す。AI が仕様を approved に付け直さない。
  SMS の扱いで人の判断が要る点（既定値、対象外の線引きなど）は ains-grilling の形（独立した質問を1つ、推奨案つき）で質問する。承認待ちの間は古い計画で実装を進めない。app/ と tests/ は変更しない。
  仕様を書き換えずに質問だけして止まった場合は、spec.md と tasks.md が初期のまま（approved）でも合格とする（command grader は「spec.md が変わったなら draft であること」を見る）。
  根拠: skills/ains-spec/SKILL.md 11 行（既存の変更なら new-change.sh は実行しない）、27・29 行（質問の形と上限は ains-grilling に従う）、37 行（対象外を書き、「ついでに」直す範囲を閉じる）、46 行（未決事項が残れば承認を求めず質問する）、57〜58 行（新たに人が承認したら approved。内容・範囲を変えたら spec.md を draft に戻し、tasks.md の status も draft に戻す。承認待ちの間は古い計画で実装を進めない）。
  Codex でも、command grader は作業ツリーと初期コミットの差分だけを見るので判定できる。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
