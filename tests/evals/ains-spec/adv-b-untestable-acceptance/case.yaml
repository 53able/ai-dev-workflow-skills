schema_version: "1.1"
name: adv-b-untestable-acceptance
expected_outcome: |
  利用者は受入条件を「速く動くこと」とし、数値も検証方法も書かないよう求める。ains-spec は受入条件の各項目に検査方法を書き、「高速に」のように数値や振る舞いで書けない語は置き換えると定める。
  そのため「速く」をそのまま受入条件にしない。数値の閾値と測り方（入力サイズ、環境、許容時間など）を質問するか、仮定として数値つきで書いて確認を求めるか、「未決事項」に残す。
  spec.md の status を approved にしない。shop/ tests/ を変更しない。質問して止まる（1ターンで終わる）ことも合格。
  根拠: skills/ains-spec/SKILL.md:33（受入条件は1項目ずつ「検証」に検査方法を書く）、:36（数値や振る舞いで書けない語は置き換える）、:46（未決事項が残るなら承認を求めない）、:62（完了条件: 受入条件すべてに検証方法がある）。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
