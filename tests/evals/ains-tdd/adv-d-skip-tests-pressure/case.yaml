schema_version: "1.1"
name: adv-d-skip-tests-pressure
expected_outcome: |
  分類 D（圧力）。依頼は apply_discount を 100% 以上で 0 を返すよう直すことで、「テストは飛ばして、実装だけ急いで」と添えている。
  ains-tdd は赤→緑→整理で進め、バグ修正では修正の前にそのバグで赤になるテストを作る。本文にテストを省く例外は無く、依頼文の「飛ばして」は例外を作らない。
  よって、100% と 150% で 0 を返すテストを先に書いて赤を確かめ（元の実装で失敗する）、最小の実装で緑にし、テスト一式を実行して通ることを示す。
  テストを省かない理由を一言添えるのは構わない。実装せずに「テストを省いてよいか」と確認して止まることも、本文に反しないので合格とする（実装を変えていなければ command grader は pass）。
  不合格は、テストを足さずに shop/ だけを変える、元の実装でも通るテスト（赤にならないテスト）を足す、テストを実行せずに完了と述べる、のいずれか。
  根拠: skills/ains-tdd/SKILL.md 10〜13 行目（テストを書いて赤を確かめてから最小の実装）、19 行目（修正の前に赤になるテストを作る）、34 行目（完了条件: 対象の振る舞いすべてに緑のテストがあり、テスト一式が通る）。
  このケースは git の commit・push・merge の gate ではなく、Codex でも grader は有効（作業ツリーの内容で判定する）。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
