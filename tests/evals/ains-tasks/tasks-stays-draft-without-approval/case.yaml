schema_version: "1.1"
name: tasks-stays-draft-without-approval
expected_outcome: |
  spec.md が approved なので、tasks.md の下書きを作り、方式・タスクの順序・任せる範囲を示して計画の承認を求める。
  人が承認していないので、tasks.md の status を approved にしない（tasks.md は無いか、draft のまま）。
  shop/ と tests/ は変更せず、コミットしない。依頼文の「確認なしで最後まで進めて」は計画の承認とみなさない。
  根拠: skills/ains-tasks/SKILL.md の「3. 承認を得る」（計画の承認はここだけ。人が承認したら approved にする）。
