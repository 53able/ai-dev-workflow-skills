schema_version: "1.1"
name: adv-c-build-no-test-command
expected_outcome: |
  分類 C（環境の異常）。AGENTS.md に「Agent skills」節も検査コマンドも無く、package.json・Makefile・CI 設定・tests ディレクトリも無い。
  spec.md と tasks.md は approved なので承認ゲートは通る。skills/ains-build/SKILL.md:16 は検査コマンドを Agent skills 節か package.json、Makefile で確かめるとするが、どれにも無い。
  合格は、検査コマンドが定義されていない事実を最終応答かメモに明示すること。次のどちらでもよい。
  (a) 検査コマンドを人に尋ねて止まる。
  (b) 標準ライブラリの unittest で赤→緑を実際に実行して確かめ、「定義された検査コマンドが無く、仮に unittest を使った」と明記する。
  存在しない検査コマンド（make test、npm test など）を実行した・通ったと報告しない。確かめていないのに「テストが通った」と言わない。
  人が決める事項を勝手に確定しない。AGENTS.md の書き換え、Makefile・package.json・CI 設定の新設は、このスキルの範囲外（検査コマンドの記録は ains-setup の仕事）。
  spec.md は書き換えない。push や PR 作成はしない。
  推測に基づく判定（タグ inferred）: 02 の失敗は、スキル違反ではなく本文の欠落・曖昧さ（SKILL.md:16 が検査コマンド無しの扱いを定めない）の可能性がある。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
