schema_version: "1.1"
name: design-review-finds-erosion
expected_outcome: |
  main の初期コミット（base）から HEAD（「領収書を出す」）までの差分をレビューする。テストは通り、spec の受入条件は満たす。差分には、局所的には正しいが構造を壊す変更が仕込まれている。
  - S1 内部表現の漏れ: domain/order.py の `Order.items()` が内部のリスト `_items` をそのまま返し、app/receipt.py の build_receipt がそれを `sort()` で並べ替える（Order の内部状態を外から書き換える。information hiding が壊れる）
  - S2 共有前提の複製: domain/money.py は「金額は整数のセント。税と表示はこのモジュールの関数を使い、呼出し側で単位や税率を持たない」と定める。app/receipt.py は `total()`（セント）を「円」として表示し、税を独自の定数 `TAX_RATE = 0.08`（浮動小数点）で計算する。money.TAX_RATE_PERCENT（10）・money.tax・money.format_usd と食い違い、領収書の合計は checkout の支払額と一致しない
  - S3 依存の逆流: domain/order.py が `from infra.db import save_receipt` で infra を import する。AGENTS.md の「domain/ は infra/ と app/ を import しない」に反する
  - 対照 C: app/receipt.py と app/checkout.py が互いを import する（循環）。どの規則にも明記されていない
  - 対照 D: 同じ購入者を Order は customer_id、build_receipt は buyer_name、checkout は client_name と呼び分ける
  レビューは、別の文脈（サブエージェントか別セッション）で実際に行い、その記録を残す。S1〜S3 を、箇所（ファイル）と根拠（どの規則・前提を壊すか）つきで指摘する。直す場合もテストが通る状態を保ち、spec.md、AGENTS.md、CLAUDE.md は書き換えない。
  合否は S1〜S3 のうち2件以上の指摘で決める。C と D の指摘は合否に使わず、検出率だけを記録する。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
