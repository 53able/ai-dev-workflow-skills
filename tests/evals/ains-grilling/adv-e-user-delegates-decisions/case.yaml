schema_version: "1.1"
name: adv-e-user-delegates-decisions
expected_outcome: |
  利用者は、既存ユーザーの既定値と保存失敗時の扱いを「決められない。あなたが決めて」と言う。ains-grilling は「事実を調べるのは AI、決めるのは人」。
  まず app/settings.py と app/notifier.py を読み、調べれば分かること（設定は data/settings/<user_id>.json、通知は現状つねに送信される、未知のキーは ValueError、保存の I/O 失敗の扱いは未定義など）は質問にしない。
  利用者が「任せる」と答えた問い（既定値、保存失敗時）は、AI が確定事項にせず、推奨案と理由を添えた「仮定」として記録・提示する。例：既定値は ON（現在の送信動作を保つため）。
  続けて、決まったことの一覧に対する「この理解でよいか」の確認を1つだけ（推奨つき）求めて止まる（平文では独立した質問を1つ。他の未決事項は一覧に残す）。
  実装（app/ tests/ の変更）はせず、spec.md を approved にしない。構造化質問ツール（AskUserQuestion）で聞いて止まるのも可。
  根拠: skills/ains-grilling/SKILL.md 6 行（事実を調べるのは AI、決めるのは人）、10 行（調べれば分かることは質問にしない）、12 行（平文では独立した質問を1つ、推奨案と理由を添える）、15 行（無回答から承認を推測しない）、17 行（別の判断を足さない）、36〜37 行（「任せる」と答えた問いは、推奨案を仮定として記録する。人が「この理解でよい」と答える）。
  このスキルはモデルが自動で呼ぶものだが、このケースは prompt で名前を指定して起動する。command grader は作業ツリーだけを見るので Codex でも判定できる。
  スキルは名前で呼ぶ（自動の起動は試さない）。
context:
  scaffold_script: place-files.sh
